<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#203b38">
  <meta name="description" content="Join the Bahadurganj College WhatsApp group.">
  <title>Bahadurganj College | WhatsApp Group</title>

  <style>
    :root {
      --green: #168879;
      --dark: #203b38;
      --dark-2: #172d2b;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background: #f7f8f7;
      display: flex;
      flex-direction: column;
    }

    .hero {
      min-height: 72vh;
      padding: 34px 22px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(135deg, var(--dark), var(--dark-2));
    }

    /* Subtle geometric background inspired by the reference image */
    .hero::before, .hero::after {
      content: "";
      position: absolute;
      inset: -30%;
      z-index: -1;
      pointer-events: none;
    }

    .hero::before {
      background:
        linear-gradient(125deg, transparent 0 28%, rgba(0,0,0,.13) 28.2% 42%, transparent 42.2%),
        linear-gradient(55deg, transparent 0 48%, rgba(255,255,255,.035) 48.2% 61%, transparent 61.2%);
      transform: rotate(-8deg);
    }

    .hero::after {
      background: linear-gradient(120deg, transparent 42%, rgba(255,255,255,.035) 42.2% 57%, transparent 57.2%);
      transform: rotate(12deg);
    }

    .eyebrow {
      align-self: flex-start;
      max-width: 760px;
      width: 100%;
      margin: 0 auto 42px;
      font-size: clamp(18px, 3vw, 25px);
      font-weight: 700;
      text-align: left;
    }

    h1 {
      margin: 0;
      max-width: 900px;
      font-size: clamp(42px, 10vw, 88px);
      line-height: 1.08;
      letter-spacing: -2px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    h2 {
      margin: 34px 0 0;
      font-size: clamp(23px, 4vw, 32px);
    }

    .intro {
      max-width: 650px;
      margin: 34px auto 0;
      font-size: clamp(18px, 4vw, 30px);
      line-height: 1.55;
      color: rgba(255,255,255,.94);
    }

    .join-area {
      min-height: 260px;
      padding: 48px 20px 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 22px;
      color: #25312f;
      text-align: center;
    }

    .join-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 62px;
      padding: 16px 24px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--green);
      box-shadow: 0 7px 0 #0d6b60, 0 12px 24px rgba(0,0,0,.13);
      font-size: clamp(17px, 3.8vw, 25px);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      animation: pulse 2.1s infinite;
    }

    .join-button:hover {
      background: #11796c;
      transform: translateY(-3px);
      box-shadow: 0 10px 0 #0d6b60, 0 16px 28px rgba(0,0,0,.16);
    }

    .join-button:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #0d6b60;
    }

    .join-button:focus-visible {
      outline: 4px solid #f4b942;
      outline-offset: 5px;
    }

    .whatsapp-icon {
      width: 27px;
      height: 27px;
      flex: 0 0 auto;
      fill: currentColor;
    }

    .status {
      margin: 0;
      color: #596561;
      font-size: 15px;
      line-height: 1.5;
    }

    .countdown {
      color: #168879;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .cancel-button {
      border: 0;
      padding: 7px 12px;
      background: transparent;
      color: #65716e;
      text-decoration: underline;
      cursor: pointer;
      font-size: 14px;
    }

    footer {
      margin-top: auto;
      padding: 18px;
      text-align: center;
      color: #8a9491;
      font-size: 12px;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 7px 0 #0d6b60, 0 12px 24px rgba(0,0,0,.13), 0 0 0 0 rgba(22,136,121,.28); }
      50% { box-shadow: 0 7px 0 #0d6b60, 0 12px 24px rgba(0,0,0,.13), 0 0 0 12px rgba(22,136,121,0); }
    }

    @media (max-width: 480px) {
      .hero { min-height: 70vh; padding: 28px 20px 48px; }
      .eyebrow { margin-bottom: 48px; }
      h1 { letter-spacing: -1.5px; }
      .intro { margin-top: 28px; }
      .join-area { min-height: 230px; padding-top: 42px; }
      .join-button { width: 100%; max-width: 440px; padding-inline: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="eyebrow">WhatsApp Group</div>
      <h1>Bahadurganj<br>College<br>Bahadurganj</h1>
      <h2>Welcome!</h2>
      <p class="intro">
        To join our WhatsApp Group,<br>
        please click the button below.
      </p>
    </section>

    <section class="join-area" aria-label="Join WhatsApp group">
      <a class="join-button" id="joinButton" href="#" rel="noopener">
        <svg class="whatsapp-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3a12.9 12.9 0 0 0-11 19.7L3.3 29l6.5-1.7A13 13 0 1 0 16 3Zm0 23.5a10.5 10.5 0 0 1-5.4-1.5l-.4-.2-3.9 1 1-3.8-.3-.4A10.5 10.5 0 1 1 16 26.5Zm5.8-7.8c-.3-.2-1.8-.9-2.1-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.5 8.5 0 0 1-2.5-1.6 9.4 9.4 0 0 1-1.7-2.2c-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.5s0-.4 0-.6-.7-1.7-.9-2.3c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4s-1.1 1.1-1.1 2.6 1.1 3 1.3 3.2 2.2 3.4 5.4 4.7c.8.3 1.4.5 1.8.6.8.2 1.5.2 2 .1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4s-.3-.2-.6-.4Z"/>
        </svg>
        Click Me To Join WhatsApp Group
      </a>

      <p class="status" id="statusMessage" aria-live="polite">
        You will be redirected automatically in
        <span class="countdown" id="countdown">10</span> seconds.
      </p>
      <button class="cancel-button" id="cancelRedirect" type="button">
        Cancel automatic redirect
      </button>
    </section>
  </main>

  <footer>Bahadurganj College · Official WhatsApp Group</footer>

  <script>
    /*
      IMPORTANT:
      Replace the URL below with your actual WhatsApp group invite link.
      Example: https://chat.whatsapp.com/xxxxxxxxxxxxxxxxxxxx
    */
    const WHATSAPP_GROUP_LINK = "https://chat.whatsapp.com/KmsuDNCORF36wM1ZaP5lhT?s=cl&p=a&iam=2";

    const joinButton = document.getElementById("joinButton");
    const countdownElement = document.getElementById("countdown");
    const statusMessage = document.getElementById("statusMessage");
    const cancelButton = document.getElementById("cancelRedirect");

    const REDIRECT_DELAY_SECONDS = 2;
    let remainingSeconds = REDIRECT_DELAY_SECONDS;
    let redirectTimer = null;
    let redirectCancelled = false;

    joinButton.href = WHATSAPP_GROUP_LINK;

    function openWhatsAppGroup() {
      if (WHATSAPP_GROUP_LINK.includes("REPLACE_WITH_YOUR_GROUP_INVITE")) {
        statusMessage.textContent = "Please add your WhatsApp group invite link in the HTML file first.";
        return;
      }
      window.location.href = WHATSAPP_GROUP_LINK;
    }

    joinButton.addEventListener("click", function (event) {
      event.preventDefault();
      openWhatsAppGroup();
    });

    function startCountdown() {
      countdownElement.textContent = remainingSeconds;

      redirectTimer = window.setInterval(function () {
        remainingSeconds -= 1;
        countdownElement.textContent = remainingSeconds;

        if (remainingSeconds <= 0) {
          window.clearInterval(redirectTimer);
          openWhatsAppGroup();
        }
      }, 1000);
    }

    cancelButton.addEventListener("click", function () {
      redirectCancelled = true;
      window.clearInterval(redirectTimer);
      statusMessage.textContent = "Automatic redirect cancelled. Click the button whenever you are ready.";
      countdownElement.textContent = "";
      cancelButton.hidden = true;
    });

    // Respect reduced-motion preference; the redirect itself remains functional.
    if (!redirectCancelled) startCountdown();
  </script>
</body>
</html>
